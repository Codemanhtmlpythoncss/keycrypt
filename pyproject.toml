[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "keycrypt"
version = "1.3.0"
description = "CLI for KeyCrypt, a Raspberry Pi Pico keyboard that encrypts every line you type"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pyserial>=3.5", "cryptography>=41"]

[project.scripts]
keycrypt = "keycrypt_cli.main:main"

[tool.setuptools]
packages = ["keycrypt_cli"]

[tool.setuptools.package-data]
keycrypt_cli = ["firmware/*.uf2"]
